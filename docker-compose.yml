services:
  postgres:
    image: postgres:16-alpine
    container_name: skita-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: skita
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skita"]
      interval: 3s
      timeout: 3s
      retries: 5

  osrm:
    image: osrm/osrm-backend:latest
    container_name: skita-osrm
    restart: unless-stopped
    ports:
      - "5001:5000"
    volumes:
      - ./osrm_data:/data
    command: osrm-routed --algorithm mld /data/jabar-dki.osrm
    profiles:
      - osrm

volumes:
  postgres_data:
    driver: local
